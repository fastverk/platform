# EndpointGroup — a named, declarative match + ordering policy the finder serves
# via ResolveGroup/WatchGroup. Holds POLICY only (capability + selector +
# ordering); the finder resolves it live against its Service cache — no endpoints
# are materialized here. Owned by the finder chart (ServerSideApply upgrades it).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: endpointgroups.finder.fastverk.dev
  labels:
    {{- include "service-finder.labels" . | nindent 4 }}
spec:
  group: finder.fastverk.dev
  scope: Namespaced
  names:
    kind: EndpointGroup
    plural: endpointgroups
    singular: endpointgroup
    shortNames: [epg]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [capability]
              properties:
                capability:
                  type: string
                  description: The capability to resolve (finder.fastverk.dev/capability, or an alias).
                selector:
                  type: object
                  additionalProperties: { type: string }
                  description: Attribute filter, e.g. {language "rust"}. Empty = all in the capability.
                portName:
                  type: string
                  description: Restrict to this named port (grpc/http). Empty = all named ports.
                ordering:
                  type: object
                  properties:
                    strategy:
                      type: string
                      enum: [Unordered, Priority]
                      default: Unordered
                      description: >-
                        Unordered = stable by url. Priority = ascending int from each backing
                        Service's finder.fastverk.dev/priority annotation (missing = last) →
                        primary→fallback / canary.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - { name: Capability, type: string, jsonPath: .spec.capability }
        - { name: Ordering, type: string, jsonPath: .spec.ordering.strategy }
