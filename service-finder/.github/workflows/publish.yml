# Publish the service-finder image + Helm chart to GHCR.
#
# Both are published PUBLICLY so any project (fastverk, aion, another cluster)
# can consume the finder with no AWS/registry auth:
#   image:  ghcr.io/fastverk/service-finder:<sha12>|latest
#   chart:  oci://ghcr.io/fastverk/charts/service-finder --version 0.1.0-<sha12>
# The Rust client lib is consumed straight from this (public) repo as a cargo
# git-dep — see docs/consuming.md.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image → ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/fastverk/service-finder:${{ steps.sha.outputs.short }}
            ghcr.io/fastverk/service-finder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: chart → ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4
      - name: lint
        run: helm lint deploy/charts/service-finder
      - name: package + push
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          # Version the chart per-commit (0.1.0-<sha12>) like the sibling fastverk
          # charts, and default appVersion to the matching image tag.
          helm package deploy/charts/service-finder \
            --version "0.1.0-${{ steps.sha.outputs.short }}" \
            --app-version "${{ steps.sha.outputs.short }}"
          helm push "service-finder-0.1.0-${{ steps.sha.outputs.short }}.tgz" \
            oci://ghcr.io/fastverk/charts
